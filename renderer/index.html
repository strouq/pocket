<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:" />
  <title>Pocket</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-state="folded" data-tool="select">

  <!-- Katlı köşe: görünmez, 1 sn basılı tut -->
  <div id="corner" title="1 saniye basılı tut ve çek">
    <span class="pip"></span>
    <svg class="ring" viewBox="0 0 24 24" aria-hidden="true">
      <circle class="ring-track" cx="12" cy="12" r="8" />
      <circle class="ring-fill"  cx="12" cy="12" r="8" />
    </svg>
  </div>

  <!-- Cep -->
  <div id="pocket">
    <header class="bar">
      <div class="brand"><span class="dot"></span>Pocket</div>

      <div class="tools">
        <button class="tool active" data-tool="select" title="Seç / Taşı (V)">
          <svg viewBox="0 0 20 20"><path d="M5 3l11 8-5 1-2 5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" data-tool="text" title="Yazı (T) — boş yere tıkla">
          <svg viewBox="0 0 20 20"><path d="M4 4h12v3M10 4v12M7 16h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="tool" data-tool="check" title="Checklist (C) — boş yere tıkla">
          <svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 10l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="sep"></span>
        <button class="tool" data-tool="pen" title="Kalem (P)">
          <svg viewBox="0 0 20 20"><path d="M4 16l1-4L14 3l3 3-9 9-4 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" data-tool="eraser" title="Silgi (E) — çizgiyi/şekli siler">
          <svg viewBox="0 0 20 20"><path d="M3 13l7-7 5 5-5 5H7zM6 13l4 4M4 17h13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
        <div class="shape-wrap">
          <button class="tool" id="shape-btn" title="Şekiller">
            <svg viewBox="0 0 20 20" data-shape-icon="line"><path d="M4 16L16 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="caret"></span>
          </button>
          <div class="popover" id="shape-pop">
            <button data-tool="line" title="Çizgi (L)"><svg viewBox="0 0 20 20"><path d="M4 16L16 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
            <button data-tool="arrow" title="Ok (A)"><svg viewBox="0 0 20 20"><path d="M4 16L16 4M9 4h7v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button data-tool="rect" title="Dikdörtgen (R)"><svg viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
            <button data-tool="ellipse" title="Elips (O)"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="7" ry="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
          </div>
        </div>
        <span class="sep"></span>
        <div class="colors">
          <button class="swatch active" data-color="#e8ebf5" style="--c:#e8ebf5"></button>
          <button class="swatch" data-color="#7c8cff" style="--c:#7c8cff"></button>
          <button class="swatch" data-color="#ff6b8b" style="--c:#ff6b8b"></button>
          <button class="swatch" data-color="#ffd166" style="--c:#ffd166"></button>
          <button class="swatch" data-color="#5ee2a0" style="--c:#5ee2a0"></button>
        </div>
        <span class="sep"></span>
        <button class="tool" id="export" title="Sayfayı PNG olarak dışa aktar">
          <svg viewBox="0 0 20 20"><path d="M10 3v10M6 9l4 4 4-4M4 16h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="win">
        <button id="fold" title="Köşeye katla (Esc)">
          <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="quit" title="Kapat">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="paper" id="paper">
      <div id="blocks"></div>
      <canvas id="ink"></canvas>
      <div class="hint" id="hint">Yazı için çift tıkla · Ctrl+V ile görsel yapıştır</div>
    </div>

    <footer class="pages">
      <div id="page-tabs"></div>
      <button id="page-add" title="Yeni sayfa">+</button>
      <span class="saved" id="saved">kaydedildi</span>
    </footer>

    <div id="grip" title="Boyutu değiştir"></div>
    <div id="size-badge"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
