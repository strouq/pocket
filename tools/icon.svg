<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f2b"/>
      <stop offset="1" stop-color="#0d0f16"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2e3d"/>
      <stop offset="1" stop-color="#1b1e29"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b0ff"/>
      <stop offset="1" stop-color="#6f7fff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- arka plan -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- cep: sol üstten çekilmiş sayfa -->
  <g filter="url(#shadow)">
    <path d="M96 96 H360 a56 56 0 0 1 56 56 V360 a56 56 0 0 1 -56 56 H152 a56 56 0 0 1 -56 -56 Z" fill="url(#sheet)"/>
  </g>
  <path d="M96 96 H360 a56 56 0 0 1 56 56 V360 a56 56 0 0 1 -56 56 H152 a56 56 0 0 1 -56 -56 Z" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>

  <!-- kıvrılan köşe -->
  <path d="M96 96 H236 Q252 96 240 108 L108 240 Q96 252 96 236 Z" fill="url(#fold)"/>
  <path d="M96 96 L236 96 L96 236 Z" fill="#ffffff" fill-opacity=".12"/>

  <!-- noktalı kağıt dokusu -->
  <g fill="#ffffff" fill-opacity=".10">
    <circle cx="300" cy="180" r="5"/><circle cx="352" cy="180" r="5"/>
    <circle cx="248" cy="232" r="5"/><circle cx="300" cy="232" r="5"/><circle cx="352" cy="232" r="5"/>
    <circle cx="196" cy="284" r="5"/><circle cx="248" cy="284" r="5"/><circle cx="300" cy="284" r="5"/><circle cx="352" cy="284" r="5"/>
    <circle cx="196" cy="336" r="5"/><circle cx="248" cy="336" r="5"/><circle cx="300" cy="336" r="5"/><circle cx="352" cy="336" r="5"/>
  </g>

  <!-- checklist satırı -->
  <circle cx="234" cy="336" r="34" fill="#7c8cff" filter="url(#glow)" opacity=".55"/>
  <rect x="204" y="306" width="60" height="60" rx="16" fill="#7c8cff"/>
  <path d="M220 336 l11 11 l24 -26" fill="none" stroke="#0d0f16" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="284" y="326" width="90" height="20" rx="10" fill="#ffffff" fill-opacity=".85"/>
</svg>
